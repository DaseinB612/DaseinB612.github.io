<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniel Walsh</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon-new.png">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a2d5a;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .star {
      position: fixed;
      color: #f0a500;
      opacity: 0;
      animation: shimmer ease-in-out forwards;
      pointer-events: none;
      user-select: none;
      z-index: 0;
    }

    @keyframes shimmer {
      0% { opacity: 0; transform: scale(0.8); }
      30% { opacity: 0.8; transform: scale(1.1); }
      70% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.8); }
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px 60px;
      position: relative;
      z-index: 1;
      gap: 0;
    }

    nav {
      display: flex;
      gap: 48px;
      margin-bottom: 60px;
    }

    nav a {
      color: #ffffff;
      text-decoration: underline;
      font-family: 'Space Mono', monospace;
      font-size: 1em;
      letter-spacing: 0.02em;
      opacity: 0.85;
      transition: opacity 0.2s, color 0.2s;
    }

    nav a:hover {
      opacity: 1;
      color: #f0a500;
    }

    .portrait {
      width: 260px;
      height: 260px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 44px;
    }

    .name {
      font-family: 'Inter', sans-serif;
      font-size: 4em;
      letter-spacing: 0.01em;
      margin-bottom: 20px;
      text-align: center;
    }

    .name .first { font-weight: 300; }
    .name .last { font-weight: 700; }

    .tagline {
      font-family: 'Space Mono', monospace;
      font-size: 1em;
      letter-spacing: 0.2em;
      color: #aabdd4;
      margin-bottom: 48px;
      text-align: center;
      height: 1.6em;
    }

    .cursor {
      display: inline-block;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .social {
      display: flex;
      gap: 36px;
      align-items: center;
    }

    .social a {
      color: #aabdd4;
      transition: color 0.2s;
      display: flex;
      align-items: center;
    }

    .social a:hover { color: #f0a500; }

    .social svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <main>
    <nav>
      <a href="/about/">About</a>
      <a href="/cv/">CV</a>
      <a href="/writing/">Writing</a>
      <a href="/projects/">Projects</a>
      <a href="/contact/">Contact</a>
    </nav>

    <img class="portrait" src="/assets/images/profile.jpg" alt="Daniel Walsh">

    <div class="name">
      <span class="first">Daniel </span><span class="last">Walsh</span>
    </div>

    <div class="tagline">
      <span id="typed"></span><span class="cursor">|</span>
    </div>

    <div class="social">
      <a href="mailto:t.walshdaniel@protonmail.com" title="Email">

        <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>

    </div>
  </main>

  <script>
    const roles = ["AI SAFETY RESEARCHER","PHILOSOPHER","GENERALIST","FIELD BUILDER","STRATEGIST"];
    let roleIndex = 0, charIndex = 0, deleting = false;
    const typedEl = document.getElementById('typed');

    function type() {
      const current = roles[roleIndex];
      if (!deleting) {
        typedEl.textContent = current.substring(0, charIndex + 1);
        charIndex++;
        if (charIndex === current.length) { deleting = true; setTimeout(type, 1800); return; }
      } else {
        typedEl.textContent = current.substring(0, charIndex - 1);
        charIndex--;
        if (charIndex === 0) { deleting = false; roleIndex = (roleIndex + 1) % roles.length; }
      }
      setTimeout(type, deleting ? 60 : 100);
    }
    type();

    const starChars = ['★','✦','✧','·','⋆'];
    function createStar() {
      const star = document.createElement('div');
      star.className = 'star';
      star.textContent = starChars[Math.floor(Math.random() * starChars.length)];
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      const duration = 2 + Math.random() * 3;
      star.style.animationDuration = duration + 's';
      star.style.fontSize = (0.5 + Math.random() * 1.2) + 'em';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), duration * 1000);
    }
    for (let i = 0; i < 30; i++) setTimeout(() => createStar(), Math.random() * 3000);
    setInterval(() => createStar(), 600);
  </script>

</body>
</html>
